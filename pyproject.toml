[project]
name = "videoai_quote"
version = "0.1.0"
description = "Batch pipeline that turns AI-written parody quotes into uploaded YouTube Shorts."
readme = "README.md"
# The TTS stack is what sets the floor: chatterbox-tts and pocket-tts both need
# 3.11+, and the pinned torch builds are only published for 3.13 here.
requires-python = ">=3.13"
dependencies = [
    # --- TTS core (src/agents/voiceover/) ---
    "soundfile==0.14.0",
    "librosa==1.0.0",
    "numpy==2.4.6",
    "scipy==1.18.1",
    "torch==2.12.1",
    "torchaudio==2.11.0",

    # --- Local TTS models ---
    "chatterbox-tts==0.1.7",
    "pocket-tts==3.3.0",

    # --- HTTP + LLM APIs (src/agents/completion/llm.py) ---
    # urllib3 arrives transitively via requests.
    "requests==2.34.2",
    "groq==1.4.0",
    "google-genai==2.25.0",

    # --- YouTube upload (src/agents/publish/youtube.py) ---
    "google-api-python-client==2.200.0",
    "google-auth-httplib2==0.4.2",
    "google-auth-oauthlib==1.4.1",

    # --- Quote card rendering (src/agents/visuals/card.py) ---
    "moviepy==2.2.1",
    "pillow==11.3.0",

    # --- Env loading (src/agents/completion/llm.py, src/helpers.py) ---
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    # The suite is deliberately narrow: it covers the logic that is cheap to get
    # wrong and expensive to discover late (the number -> cast mapping, the
    # counter's advance rules, script JSON parsing, title/description limits).
    # It does not mock the TTS or the renderer -- those are verified by running
    # the pipeline, not by asserting on their internals.
    "pytest==9.0.1",
    # pyflakes stays because it is the only thing standing between a typo and a
    # runtime AttributeError in a pipeline whose expensive step is a 45-second
    # render. ruff lints and formats; it is not a correctness gate.
    "pyflakes==3.4.0",
    "ruff==0.15.1",
]

[tool.pytest.ini_options]
# `package = false` means the project is never installed into the venv, so
# `import src...` only resolves with the repo root on the path. Without this,
# pytest prepends the tests/ directory instead and every import fails.
pythonpath = ["."]
testpaths = ["tests"]
# The suite must never touch the network or a real API key. Anything that needs
# one is an integration check, run by running the pipeline, not by pytest.
addopts = "-q --strict-markers"

[tool.ruff]
# Chatterbox and google-genai are third-party and not ours to reformat.
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "output", "debug_output"]

[tool.ruff.lint]
# E4/E7/E9 are the correctness-adjacent pycodestyle rules (unused imports,
# undefined names). The stylistic E1/E2/E3 and W sets are left off on purpose:
# this repo is not ruff-formatted, and enabling them would bury real findings
# under hundreds of pre-existing nits.
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = [
    # Imports deliberately follow load_dotenv() in the entry points and in
    # llm.py itself, which reads its keys from the environment at import time.
    # Moving them above the dotenv call would silently produce a client with no
    # credentials, which is a far worse failure than the style warning.
    "E402",
    # `l` for a left/limit/line local is used throughout and is unambiguous in
    # context.
    "E741",
]

[tool.uv]
# An application, not a library: uv should not try to build and install this
# directory as a package.
package = false
# chatterbox-tts pins librosa==0.11.0, torch==2.6.0 and torchaudio==2.6.0 as hard
# transitive requirements. Left alone, resolution either fails outright or
# silently installs an older stack than the one the voices were tuned against --
# and a mismatched torch/torchaudio pair fails at import with a CUDA/CPU ABI
# error that reads like a broken GPU rather than a resolver decision. These
# overrides are the known-good pair the reference clips were cloned with.
override-dependencies = [
    "librosa==1.0.0",
    "torch==2.12.1",
    "torchaudio==2.11.0",
    "numpy==2.4.6",
]
